syntax = "proto3";

package com.android.devicediagnostics;
option java_outer_classname = "Protos";

message TestResults {
    bool screen_test = 1;
    bool touch_test = 2;
}

message DeviceReport {
    TestResults tests = 1;
    bytes attestation = 2;
}

message TrustedDeviceInfo {
    bytes challenge = 1;
}
